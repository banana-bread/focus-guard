<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Site Blocked — Focus Guard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      text-align: center;
      max-width: 420px;
      padding: 48px 32px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .shield { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .domain { font-size: 18px; color: #e53935; font-weight: 600; margin-bottom: 24px; }
    .message { font-size: 14px; color: #666; margin-bottom: 32px; }
    #unlock-btn {
      padding: 12px 24px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: #fff;
      cursor: pointer;
      opacity: 0.5;
      pointer-events: none;
    }
    #unlock-btn:not(:disabled) {
      opacity: 1;
      pointer-events: auto;
    }
    #unlock-btn:not(:disabled):hover {
      background: #1565c0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="shield">🛡️</div>
    <h1>Site Blocked</h1>
    <p class="domain" id="domain-display"></p>
    <p class="message">This site is blocked by Focus Guard to help you stay focused.</p>
    <button id="unlock-btn" disabled>Unlock with Security Key</button>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
