<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Site Blocked — Focus Guard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f0f4ff 0%, #fafafa 100%);
      color: #333;
    }
    .container {
      text-align: center;
      max-width: 440px;
      padding: 48px 36px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .shield {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    .domain {
      font-size: 20px;
      color: #2563eb;
      font-weight: 600;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .message {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    #unlock-btn {
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    #unlock-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #unlock-btn:not(:disabled):hover {
      background: #1d4ed8;
    }
    .status {
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
    }
    .status.error { color: #dc2626; }
    .status.info { color: #6b7280; }
  </style>
</head>
<body>
  <div class="container">
    <img class="shield" src="icons/icon-128.png" alt="Focus Guard">
    <h1>Taking a breather</h1>
    <p class="domain" id="domain-display"></p>
    <p class="message">You asked Focus Guard to block this site so you can stay on track. If you really need access, tap your security key to unlock it temporarily.</p>
    <button id="unlock-btn" disabled>Unlock with Security Key</button>
    <p id="status-msg" class="status"></p>
  </div>
  <script type="module" src="blocked.js"></script>
</body>
</html>
