<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Focus Guard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1><img src="icons/icon-48.png" alt=""> Focus Guard</h1>

  <div class="add-domain">
    <input type="text" id="domain-input" placeholder="e.g. reddit.com" />
    <button id="add-btn">Add</button>
  </div>
  <div id="error-msg" class="error" hidden></div>
  <div id="success-msg" class="success" hidden></div>

  <p class="list-label">Blocked sites</p>
  <ul id="blocklist"></ul>

  <hr class="divider">

  <div id="key-section">
    <div id="key-unregistered" hidden>
      <p class="key-status"><span class="dot dot-red"></span> No security key registered</p>
      <button id="register-btn">Register Security Key</button>
    </div>
    <div id="key-registered" hidden>
      <p class="key-status"><span class="dot dot-green"></span> Security key registered</p>
      <div id="key-info" class="key-info"></div>
      <button id="remove-key-btn" class="btn-danger">Remove Key</button>
    </div>
    <div id="key-error" class="error" hidden></div>
  </div>

  <hr class="divider">

  <div id="settings-section">
    <p class="list-label">Settings</p>
    <div class="setting-row">
      <label for="unlock-duration">Unlock duration</label>
      <select id="unlock-duration">
        <option value="5">5 minutes</option>
        <option value="15">15 minutes</option>
        <option value="30">30 minutes</option>
        <option value="60">60 minutes</option>
        <option value="custom">Custom...</option>
      </select>
    </div>
    <div id="custom-duration-row" class="setting-row" hidden>
      <label for="custom-duration">Minutes</label>
      <input type="number" id="custom-duration" min="1" max="1440" placeholder="e.g. 45">
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
