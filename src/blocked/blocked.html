<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Blocked — Focus Guard</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <div class="card">
      <div class="shield-icon">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#93c5fd" />
              <stop offset="100%" stop-color="#1e40af" />
            </linearGradient>
          </defs>
          <path
            d="M32 5 L52 14 L52 30 C52 46 32 60 32 60 C32 60 12 46 12 30 L12 14 Z"
            fill="url(#sg)"
          />
        </svg>
      </div>
      <h1 class="heading">Site Blocked</h1>
      <p id="domain" class="domain-text"></p>

      <div id="state-locked">
        <p class="message">This site is on your blocklist.</p>
        <p class="hint">Touch your hardware key to unlock temporarily.</p>
        <div class="unlock-row">
          <select id="duration-select">
            <option value="300000">5 min</option>
            <option value="900000">15 min</option>
            <option value="1800000" selected>30 min</option>
            <option value="3600000">60 min</option>
          </select>
          <button id="btn-unlock" class="btn-primary">Unlock</button>
        </div>
        <p id="unlock-error" class="error hidden"></p>
      </div>
    </div>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
